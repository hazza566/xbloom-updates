<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مولّد أكواد التفعيل</title>
<style>
  :root{--bg:#131416;--card:#1c1c1d;--line:#3a3a40;--text:#f2efe9;--muted:#a6a39c;--gold:#d2ae68;--ok:#52c27a;--err:#ff8a80}
  @media (prefers-color-scheme: light){:root{--bg:#f5f3ef;--card:#fff;--line:#d9d9de;--text:#20232a;--muted:#656b77;--gold:#9a7424}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;padding:24px 16px}
  main{width:min(560px,100%)} h1{font-size:22px;margin:0 0 4px} p{color:var(--muted);margin:0 0 16px}
  section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  h2{font-size:15px;margin:0 0 10px;color:var(--gold)}
  input[type=text],textarea{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;color:inherit;padding:10px 12px;font:inherit;direction:ltr;text-align:left}
  textarea{min-height:110px;resize:vertical;font:13px/1.4 ui-monospace,Consolas,monospace;word-break:break-all}
  button{min-height:46px;padding:0 20px;border-radius:12px;border:0;background:var(--gold);color:#1b1405;font:700 16px inherit;cursor:pointer}
  button.sec{background:transparent;color:inherit;border:1px solid var(--line)} button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap} .msg{min-height:22px;margin-top:8px;font-size:14px}.ok{color:var(--ok)}.err{color:var(--err)}
  small{color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>🔑 مولّد أكواد التفعيل</h1>
  <p>يعمل على جهازك فقط، بدون إنترنت. لا يُرسل المفتاح ولا المعرّف لأي جهة.</p>

  <section>
    <h2>١. مفتاحك السري</h2>
    <input type="file" id="keyfile" accept=".pem,.txt">
    <p style="margin:8px 0 4px"><small>أو الصق نص المفتاح (من ملف <b>private.pem</b>) هنا:</small></p>
    <textarea id="keytext" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----" style="min-height:84px"></textarea>
    <div class="msg" id="keymsg"><small>لا يُحفظ المفتاح في الصفحة ولا يُرسل لأي جهة، وتحتاج إدخاله كل مرة.</small></div>
  </section>

  <section>
    <h2>٢. معرّف جهاز صديقك</h2>
    <input type="text" id="devid" placeholder="A1B2-C3D4-E5F6-0718" autocomplete="off" spellcheck="false">
    <div class="msg" id="idmsg"></div>
    <div class="row" style="margin-top:8px"><button id="go" disabled>إنشاء الكود</button></div>
  </section>

  <section id="out" hidden>
    <h2>٣. كود التفعيل — أرسله لصديقك</h2>
    <textarea id="code" readonly></textarea>
    <div class="row" style="margin-top:8px"><button id="copy">نسخ الكود</button><button class="sec" id="clear">مسح</button></div>
    <div class="msg" id="copymsg"></div>
  </section>
</main>
<script>
(function () {
  var key = null, $ = function (id) { return document.getElementById(id); };
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64url(buf) { var s = '', u = new Uint8Array(buf); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function say(el, text, cls) { el.className = 'msg ' + (cls || ''); el.textContent = text; }
  function cleanId(v) { return String(v || '').replace(/[^0-9a-f]/gi, '').toLowerCase(); }
  function refresh() { $('go').disabled = !(key && cleanId($('devid').value).length === 16); }

  function loadKey(text) {
    key = null; refresh();
    var m = /-----BEGIN PRIVATE KEY-----([\s\S]+?)-----END PRIVATE KEY-----/.exec(String(text));
    if (!m) { say($('keymsg'), 'ليس مفتاحًا صالحًا (يجب أن يبدأ بـ BEGIN PRIVATE KEY).', 'err'); return; }
    crypto.subtle.importKey('pkcs8', b64(m[1].replace(/\s+/g, '')), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign'])
      .then(function (k) { key = k; say($('keymsg'), '✓ تم تحميل المفتاح', 'ok'); refresh(); })
      .catch(function () { say($('keymsg'), 'تعذّر قراءة المفتاح.', 'err'); });
  }
  $('keytext').addEventListener('input', function () { if (this.value.trim()) loadKey(this.value); else { key = null; refresh(); } });
  $('keyfile').addEventListener('change', function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader(); r.onload = function () { loadKey(r.result); }; r.readAsText(f); return;
    var r2 = new FileReader();
    r2.onload = function () {
      var m = /-----BEGIN PRIVATE KEY-----([\s\S]+?)-----END PRIVATE KEY-----/.exec(String(r2.result));
      if (!m) { say($('keymsg'), 'الملف ليس مفتاحًا صالحًا (private.pem).', 'err'); return; }
      crypto.subtle.importKey('pkcs8', b64(m[1].replace(/\s+/g, '')), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign'])
        .then(function (k) { key = k; say($('keymsg'), '✓ تم تحميل المفتاح', 'ok'); refresh(); })
        .catch(function () { say($('keymsg'), 'تعذّر قراءة المفتاح.', 'err'); });
    };
    r.readAsText(f);
  });
  $('devid').addEventListener('input', function () {
    var n = cleanId(this.value).length;
    say($('idmsg'), n === 0 ? '' : n === 16 ? '✓ معرّف صحيح' : 'المعرّف 16 خانة (الآن ' + n + ')', n === 16 ? 'ok' : 'err'); refresh();
  });
  $('go').addEventListener('click', function () {
    var id = cleanId($('devid').value);
    crypto.subtle.sign({ name: 'ECDSA', hash: 'SHA-256' }, key, new TextEncoder().encode('xbloom:' + id)).then(function (sig) {
      $('code').value = b64url(sig); $('out').hidden = false; say($('copymsg'), '', '');
    }).catch(function () { say($('idmsg'), 'تعذّر إنشاء الكود.', 'err'); });
  });
  $('copy').addEventListener('click', function () {
    var t = $('code'); t.select();
    (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject()).catch(function () { document.execCommand('copy'); })
      .then(function () { say($('copymsg'), '✓ تم النسخ', 'ok'); }, function () { say($('copymsg'), '✓ تم النسخ', 'ok'); });
  });
  $('clear').addEventListener('click', function () { $('code').value = ''; $('out').hidden = true; $('devid').value = ''; say($('idmsg'), '', ''); refresh(); });
})();
</script>
</body>
</html>
